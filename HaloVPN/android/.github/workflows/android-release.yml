name: Android Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

- name: Create signing properties (keystore)
        run: |
          mkdir -p android
          printf "storeFile=android/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > android/keystore.properties
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
            echo "Keystore decoded to android/release.keystore"
          fi
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: (Optional) Upload signing file if available
        if: secrets.KESTORE_FILE_PATH != ''
        run: |
          echo "Signing keystore path provided via secret; ensure it exists in repository or in runner."
        # This step is a placeholder to indicate where you could fetch/upload a keystore if needed.

      - name: Build Release APK
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF8"
        run: |
          cd android
          if [ -f gradlew ]; then
            ./gradlew assembleRelease
          else
            # Fallback if Gradle wrapper is not present; assumes Gradle is installed on runner
            gradle -p . assembleRelease
          fi
      - name: Run TypeScript type-check
        run: |
          cd ..
          npm run test

      - name: Archive APK
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: HaloVPN-Android-Release
          path: android/app/build/outputs/apk/release/*.apk
