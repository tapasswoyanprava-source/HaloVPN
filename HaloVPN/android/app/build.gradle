apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.haloVPN.android"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

signingConfigs {
        release {
            // Dynamic signing: try keystore.properties (CI-friendly), otherwise CI env vars
            def keystorePropertiesFile = rootProject.file("android/keystore.properties")
            def keystoreProperties = new java.util.Properties()
            def signingPresent = false

            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))
                def sf = keystoreProperties['storeFile']?.toString()
                def sp = keystoreProperties['storePassword']?.toString()
                def ka = keystoreProperties['keyAlias']?.toString()
                def kp = keystoreProperties['keyPassword']?.toString()
                if (sf && sp && ka && kp) {
                    signingPresent = true
                    storeFile file(sf)
                    storePassword sp
                    keyAlias ka
                    keyPassword kp
                }
            }

            if (!signingPresent) {
                def ciStore = System.getenv("CI_RELEASE_STORE_FILE")
                def ciStorePwd = System.getenv("CI_RELEASE_STORE_PASSWORD")
                def ciAlias = System.getenv("CI_RELEASE_KEY_ALIAS")
                def ciKeyPwd = System.getenv("CI_RELEASE_KEY_PASSWORD")
                if (ciStore && ciStorePwd && ciAlias && ciKeyPwd) {
                    signingPresent = true
                    storeFile file(ciStore)
                    storePassword ciStorePwd
                    keyAlias ciAlias
                    keyPassword ciKeyPwd
                }
            }

            // If still not signingPresent, no signing configured for release (local/dev)
            if (!signingPresent) {
                println("WARNING: Release signing properties not provided. Release builds may fail without a signing config.")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Placeholder: add app dependencies here (e.g., implementation "androidx.core:core-ktx:1.6.0")
}
